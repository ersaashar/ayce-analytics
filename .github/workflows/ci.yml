name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"

      - name: Sync
        run: uv sync --locked

      - name: Ruff check
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: dummy-ci-secret-key-0123456789abcdef
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"

      - name: Lock check
        run: uv lock --check

      - name: Sync
        run: uv sync --locked

      - name: System check
        run: uv run --locked python manage.py check

      - name: Tests
        run: uv run --locked python manage.py test tests --verbosity 2
