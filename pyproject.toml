[project]
name = "ayce-analytics-v2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "defusedxml>=0.7.1,<1",
    "openpyxl>=3.1.5,<4",
    "pydantic-ai-slim[mcp,openai]>=2,<3",
    "python-docx>=1.2,<2",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
    "fastmcp-slim[client]>=4,<5",
]

[dependency-groups]
dev = [
    "fastmcp-slim[server]>=4,<5",
    "httpx2>=2.16,<3",
    "pre-commit>=4,<5",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "DJ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Generated migration modules use Django's list-valued class attributes.
"*/migrations/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["chat", "config", "tests"]
